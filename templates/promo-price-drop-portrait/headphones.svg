<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- Wireless over-ear headphones, drawn for this template. Original work, MIT. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9CFDF"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6FB"/>
      <stop offset="1" stop-color="#B9C0D3"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A4058"/>
      <stop offset="1" stop-color="#1F2335"/>
    </linearGradient>
  </defs>
  <ellipse cx="300" cy="560" rx="210" ry="18" fill="#000000" fill-opacity="0.28"/>
  <!-- headband -->
  <path d="M120 360 C120 150 480 150 480 360" fill="none" stroke="url(#band)" stroke-width="46" stroke-linecap="round"/>
  <path d="M150 330 C160 190 440 190 450 330" fill="none" stroke="#2A2F45" stroke-width="20" stroke-linecap="round"/>
  <path d="M170 300 C200 210 400 210 430 300" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
  <!-- sliders -->
  <rect x="104" y="330" width="34" height="64" rx="12" fill="#9EA6BD"/>
  <rect x="462" y="330" width="34" height="64" rx="12" fill="#9EA6BD"/>
  <!-- left cup -->
  <rect x="60" y="370" width="118" height="180" rx="54" fill="url(#shell)"/>
  <rect x="150" y="380" width="56" height="160" rx="28" fill="url(#pad)"/>
  <rect x="84" y="404" width="70" height="112" rx="35" fill="none" stroke="#FF4D5E" stroke-width="7"/>
  <circle cx="119" cy="460" r="13" fill="#2A2F45"/>
  <!-- right cup -->
  <rect x="422" y="370" width="118" height="180" rx="54" fill="url(#shell)"/>
  <rect x="394" y="380" width="56" height="160" rx="28" fill="url(#pad)"/>
  <rect x="446" y="404" width="70" height="112" rx="35" fill="none" stroke="#FF4D5E" stroke-width="7"/>
  <circle cx="481" cy="460" r="13" fill="#2A2F45"/>
  <!-- highlights -->
  <path d="M80 420 C80 395 95 385 110 382" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <path d="M442 420 C442 395 457 385 472 382" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
</svg>
