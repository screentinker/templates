<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Building directory</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<div class="frame">
  <header class="head">
    <div class="brand">
      <img id="logo" class="logo" alt="" hidden>
      <div id="mono" class="mono" aria-hidden="true" hidden></div>
      <div class="titles">
        <h1 id="title" class="title" dir="auto"></h1>
        <div id="address" class="address" dir="auto"></div>
      </div>
    </div>
    <div id="clockbox" class="clockbox">
      <div id="clock" class="clock"></div>
      <div id="date" class="date"></div>
    </div>
  </header>

  <div id="here" class="here" hidden>
    <span id="here-pin" class="here-pin" aria-hidden="true"></span>
    <span id="here-text" class="here-text" dir="auto"></span>
  </div>

  <main id="stage" class="stage">
    <div id="list" class="list"></div>
  </main>

  <nav id="rail" class="rail" aria-hidden="true"></nav>

  <footer class="foot">
    <div id="footer" class="footer-text" dir="auto"></div>
    <div id="pager" class="pager" aria-hidden="true"></div>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
