<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- Placeholder product: a pair of headphones drawn for this template (original work, MIT). -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A505B"/>
      <stop offset="0.45" stop-color="#262A31"/>
      <stop offset="1" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="shellR" x1="1" y1="0" x2="0" y2="1">
