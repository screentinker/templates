<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team celebrations</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="playful">
<div class="bg" aria-hidden="true"></div>
<canvas id="fx" class="fx" aria-hidden="true"></canvas>

<!-- Icons, drawn for this template. Each is used with <use href="#…">. -->
<svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-birthday" viewBox="0 0 24 24">
    <path d="M4 21h16M5.5 21v-6.5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2V21M5.5 16.2c1.3 1 2.6 1 3.9 0s2.6-1 3.9 0 2.6 1 3.9 0 1.3-.6 1.3-.6M8.5 12.5V9.5M12 12.5V9.5M15.5 12.5V9.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8.5 5.2c.7.8.7 1.6 0 2.2-.7-.6-.7-1.4 0-2.2zM12 4.6c.7.8.7 1.6 0 2.2-.7-.6-.7-1.4 0-2.2zM15.5 5.2c.7.8.7 1.6 0 2.2-.7-.6-.7-1.4 0-2.2z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-anniversary" viewBox="0 0 24 24">
    <path d="M12 2.8l2.75 5.57 6.15.9-4.45 4.33 1.05 6.12L12 16.83l-5.5 2.9 1.05-6.13L3.1 9.27l6.15-.9z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-new" viewBox="0 0 24 24">
    <circle cx="9.5" cy="8" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
    <path d="M2.8 20.5c.8-3.7 3.5-5.7 6.7-5.7s5.9 2 6.7 5.7M19 7.5v6.5M15.75 10.75h6.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-balloons" viewBox="0 0 120 120">
    <path d="M40 66c-2 14 6 24 2 40M64 60c0 18-6 28 0 46M86 70c3 12-4 22 0 36" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
    <ellipse cx="40" cy="44" rx="17" ry="21" style="fill:var(--c1)"/>
    <ellipse cx="64" cy="36" rx="19" ry="23" style="fill:var(--c2)"/>
    <ellipse cx="86" cy="50" rx="16" ry="20" style="fill:var(--c3)"/>
    <path d="M37 65l3-1 3 1-3 3zM61 59l3-1 3 1-3 3zM83 70l3-1 3 1-3 3z" fill="currentColor" opacity=".55"/>
    <ellipse cx="33" cy="36" rx="4" ry="7" fill="#fff" opacity=".35" transform="rotate(20 33 36)"/>
    <ellipse cx="57" cy="27" rx="4.5" ry="7.5" fill="#fff" opacity=".35" transform="rotate(20 57 27)"/>
    <ellipse cx="80" cy="42" rx="3.8" ry="6.5" fill="#fff" opacity=".35" transform="rotate(20 80 42)"/>
  </symbol>
</svg>

<div class="frame">
  <header class="head">
    <img id="logo" class="logo" alt="" hidden>
    <h1 id="title" class="title" dir="auto"></h1>
    <div id="range" class="range"></div>
  </header>

  <main id="main" class="main">
    <section id="card" class="card">
      <svg class="watermark" aria-hidden="true"><use id="wm-use" href="#i-birthday"></use></svg>
      <div id="card-in" class="card-in">
        <div class="av-wrap">
          <div id="avatar" class="avatar"><span id="initials"></span></div>
          <div id="badge" class="badge"><svg aria-hidden="true"><use id="badge-use" href="#i-birthday"></use></svg><span id="badge-num" class="badge-num"></span></div>
        </div>
        <div class="text">
          <div id="kicker" class="kicker"></div>
          <div id="name" class="name" dir="auto"></div>
          <div id="meta" class="meta" dir="auto"></div>
        </div>
        <div id="when" class="when"></div>
      </div>
      <div class="progress" aria-hidden="true"><span id="bar"></span></div>
    </section>

    <aside id="side" class="side">
      <div id="list-title" class="list-title"></div>
      <ol id="list" class="list"></ol>
      <div id="pager" class="pager" aria-hidden="true"></div>
    </aside>

    <section id="empty" class="empty" hidden>
      <svg class="empty-art" aria-hidden="true"><use href="#i-balloons"></use></svg>
      <div class="empty-words">
        <div id="empty-title" class="empty-title" dir="auto"></div>
        <div id="empty-text" class="empty-text" dir="auto"></div>
        <div id="empty-hint" class="empty-hint"></div>
      </div>
      <div id="next" class="next"></div>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
